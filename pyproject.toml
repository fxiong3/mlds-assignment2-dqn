[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mlds-assignment2-dqn"
version = "0.1.0"
description = "Reproducible DQN experiments for CartPole-v1 and MsPacman-v5"
requires-python = ">=3.10,<3.13"
dependencies = [
  "ale-py>=0.10,<0.12",
  "autorom[accept-rom-license]>=0.6.1,<0.7",
  "gymnasium[classic-control]>=1.0,<1.3",
  "matplotlib>=3.9,<4",
  "numpy>=1.26,<3",
  "torch>=2.4,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.8,<1",
]

[project.scripts]
dqn-assignment = "dqn_assignment.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dqn_assignment"]

[tool.pytest.ini_options]
addopts = "--strict-markers --cov=dqn_assignment --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

